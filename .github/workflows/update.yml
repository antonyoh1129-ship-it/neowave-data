name: update-data
on:
  schedule:
    - cron: "15 0 * * *"   # daily 00:15 UTC (KST 09:15)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 fetch_15m.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Bitstamp_BTCUSD_15m.csv
          git diff --cached --quiet || git commit -m "data: 15m update"
          git push
